name: bench-arc-challenge
version: 0.1.0
question: "Does the model pick the option ARC-Challenge keys as correct?"

# AI2 ARC (Clark et al., 2018), Challenge test split, CC-BY-SA-4.0.
# Fetched unmodified by `python benchmarks/fetch.py`. The correct option's TEXT
# is the target, not its letter, so the target stays invariant when the shuffle
# probe permutes the block.

entitled_claims:
  - "Which option each model picks on 1172 ARC-Challenge items, per model."

data: {path: items.jsonl, format: jsonl, render_choices: true}

models:
  - {provider: dry, model: dry-strong}

scorer:
  kind: includes
  witnesses:
    - {output: "Planetary density will decrease.", target: "Planetary density will decrease.", expect: pass}
    - {output: "The answer is Planetary density will decrease.", target: "Planetary density will decrease.", expect: pass}
    - {output: "Planetary years will become longer.", target: "Planetary density will decrease.", expect: fail}
    - {output: "", target: "Planetary density will decrease.", expect: fail}
    - {output: "planetary density will decrease.", target: "Planetary density will decrease.", expect: fail,
       why: "substring matching is case-sensitive, and this pod says so"}
    - {output: "Planetary  density will decrease.", target: "Planetary density will decrease.", expect: fail,
       why: "a doubled space is part of the match"}
    - {output: "Planetary density", target: "Planetary density will decrease.", expect: fail,
       why: "a strict prefix is not the answer"}

run: {n: 1172, seed: 7, budget_usd: 0}
