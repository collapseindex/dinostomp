name: bench-medmcqa
version: 0.1.0
question: "Does the model pick the option MedMCQA keys as correct?"

# MedMCQA (Pal et al., 2022), first 3000 rows of the validation split, MIT.
# Fetched unmodified by `python benchmarks/fetch.py`. The correct option's TEXT
# is the target, not its letter, so the target survives the shuffle probe.

entitled_claims:
  - "Which option each model picks on these MedMCQA items, per model."

data: {path: items.jsonl, format: jsonl, render_choices: true}

models:
  - {provider: dry, model: dry-strong}

scorer:
  kind: includes
  witnesses:
    - {output: "alpha beta", target: "alpha beta", expect: pass}
    - {output: "The answer is alpha beta", target: "alpha beta", expect: pass}
    - {output: "gamma delta", target: "alpha beta", expect: fail}
    - {output: "", target: "alpha beta", expect: fail}
    - {output: "ALPHA BETA", target: "alpha beta", expect: fail, why: "substring matching is case-sensitive, and this pod says so"}
    # a doubled space, not a removed one: the space-blind mutant COLLAPSES runs
    # of whitespace rather than stripping it, so only a run distinguishes them
    - {output: "alpha  beta", target: "alpha beta", expect: fail, why: "a doubled space is part of the match"}
    - {output: "alpha bet", target: "alpha beta", expect: fail, why: "a strict prefix is not the answer"}

run: {n: 3000, seed: 7, budget_usd: 0}
