name: bench-nclex
version: 0.1.0
question: "Does the model pick the option the NCLEX item keys as correct?"

# NCLEX-style nursing licensure questions, fetched by
# `python benchmarks/fetch.py nclex`. The examination this imitates
# licenses nurses in the United States. The 'A) ' prefixes are stripped
# from the options AND from the keyed answer, so the target is the answer
# rather than its letter and survives an option shuffle.
#
# SCOPE: this audits one redistributed copy of a question bank, not the
# examination as administered. A defect found here may belong to the
# repackaging; LogiQA (F-019) is the standing proof that the distinction is real.

entitled_claims:
  - "Which option each model picks on these NCLEX-style items, per model."
  - "Nothing about the original examination's quality: this audits one redistributed copy of it."

data: {path: items.jsonl, format: jsonl, render_choices: true}

models:
  - {provider: dry, model: dry-strong}

scorer:
  kind: includes
  witnesses:
    - {output: "alpha beta", target: "alpha beta", expect: pass}
    - {output: "The answer is alpha beta", target: "alpha beta", expect: pass}
    - {output: "gamma delta", target: "alpha beta", expect: fail}
    - {output: "", target: "alpha beta", expect: fail}
    - {output: "ALPHA BETA", target: "alpha beta", expect: fail, why: "substring matching is case-sensitive, and this pod says so"}
    - {output: "alpha  beta", target: "alpha beta", expect: fail, why: "a doubled space is part of the match"}
    - {output: "alpha bet", target: "alpha beta", expect: fail, why: "a strict prefix is not the answer"}

run: {n: 86, seed: 7, budget_usd: 0}
