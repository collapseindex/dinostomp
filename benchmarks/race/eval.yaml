name: bench-race
version: 0.1.0
question: "Does the model pick the option RACE keys as correct, given the passage?"

# RACE (Lai et al., 2017), high-school test split, fetched by
# `python benchmarks/fetch.py race`. The ARTICLE is part of the input, which makes
# this the first pod here where the question is a small fraction of what the model
# reads. `answer` is a letter in the source, so the target is the looked-up option
# TEXT: a letter target would survive no option shuffle and make P9 meaningless.

entitled_claims:
  - "Which option each model picks on these RACE items, per model."
  - "Nothing about the dataset's quality beyond what the checks below actually read."

data: {path: items.jsonl, format: jsonl, render_choices: true}

models:
  - {provider: dry, model: dry-strong}

scorer:
  kind: includes
  witnesses:
    - {output: "alpha beta", target: "alpha beta", expect: pass}
    - {output: "The answer is alpha beta", target: "alpha beta", expect: pass}
    - {output: "gamma delta", target: "alpha beta", expect: fail}
    - {output: "", target: "alpha beta", expect: fail}
    - {output: "ALPHA BETA", target: "alpha beta", expect: fail, why: "substring matching is case-sensitive, and this pod says so"}
    - {output: "alpha  beta", target: "alpha beta", expect: fail, why: "a doubled space is part of the match"}
    - {output: "alpha bet", target: "alpha beta", expect: fail, why: "a strict prefix is not the answer"}

run: {n: 1500, seed: 7, budget_usd: 0}
