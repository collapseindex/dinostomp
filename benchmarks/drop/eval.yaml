name: bench-drop
version: 0.1.0
question: "Does the model produce the reference answer span for each DROP question?"

# DROP (Dua et al., 2019), validation split, fetched by
# `python benchmarks/fetch.py drop`. Passage plus question, answer is a SPAN.
# Only single-span answers are kept: a multi-span answer is a different scoring
# contract, and folding one into a single target would invent an answer the
# dataset does not give.

entitled_claims:
  - "Single-span answer match on these DROP items, per model."
  - "Nothing about the dataset's quality beyond what the checks below actually read."

data: {path: items.jsonl, format: jsonl}

models:
  - {provider: dry, model: dry-strong}

scorer:
  kind: includes
  witnesses:
    - {output: "alpha beta", target: "alpha beta", expect: pass}
    - {output: "The answer is alpha beta", target: "alpha beta", expect: pass}
    - {output: "gamma delta", target: "alpha beta", expect: fail}
    - {output: "", target: "alpha beta", expect: fail}
    - {output: "ALPHA BETA", target: "alpha beta", expect: fail, why: "substring matching is case-sensitive, and this pod says so"}
    - {output: "alpha  beta", target: "alpha beta", expect: fail, why: "a doubled space is part of the match"}
    - {output: "alpha bet", target: "alpha beta", expect: fail, why: "a strict prefix is not the answer"}

run: {n: 2000, seed: 7, budget_usd: 0}
